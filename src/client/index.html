<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      The mustache placeholders below survive `vite build` and are filled in by
      the Fastify server at boot from the STREAM_* env vars (src/server/server.ts),
      and by a dev-only Vite plugin during `vite dev` (vite.config.ts).
      (Don't write their names in this comment — the substitution is a plain
      string replace and would rewrite them here too.)

      Keeping the title and social metadata in the served HTML means link
      previews and search engines see them without executing any JavaScript.
    -->
    <title>{{TITLE}}</title>
    <meta name="description" content="{{TAGLINE}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{TAGLINE}}" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0e0f12" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐔</text></svg>"
    />
    <script type="application/json" id="app-bootstrap">
      {{BOOTSTRAP}}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
