x-default-logging: &default_logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-health-check-defaults: &health_check_defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  cam-broadcaster:
    build:
      context: .
    image: cam-broadcaster:latest
    container_name: cam-broadcaster
    restart: unless-stopped
    env_file: .env
    tmpfs:
      - /hls
    logging:
      <<: *default_logging
    ports:
      - "8080:8080"
    labels:
      autoheal-app: true
    healthcheck:
      <<: *health_check_defaults
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:${PORT:-8080}/healthz" ]

  # The tunnel's public hostname in the Cloudflare dashboard must point at 
  # http://cam-broadcaster:8080 — NOT localhost:8080. See "Create a Cloudflare 
  # Tunnel" in the README.
  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --metrics 127.0.0.1:20241 run --protocol ${TUNNEL_PROTOCOL:-http2}
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env — see the README}
    labels:
      autoheal-app: true
    healthcheck:
      <<: *health_check_defaults
      test: [ "CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready" ]
    # Deliberately NOT `condition: service_healthy`: the app only reports healthy
    # once ffmpeg is producing segments, and a camera outage must not take the
    # whole site down. Better to serve the page and let the player say so.
    depends_on:
      - cam-broadcaster
    logging:
      <<: *default_logging

  autoheal:
    image: willfarrell/autoheal:latest
    network_mode: none
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal-app
    logging:
      <<: *default_logging
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
